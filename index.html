<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulation ATS</title>
<style>
  :root{
    --bg:#f3f5f9; --card:#fff; --ink:#0f172a; --mut:#64748b; --line:#e2e8f0;
    --brand:#4f46e5; --ok:#10b981; --okbg:#d1fae5; --ko:#ef4444; --kobg:#fee2e2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
  button,input,select{font:inherit;color:inherit}

  /* Barre du haut */
  .top{background:#0f172a;color:#fff;display:flex;align-items:center;gap:16px;padding:12px 22px;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.02em;font-size:18px}
  .logo i{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#818cf8,#4f46e5);display:grid;place-items:center;font-style:normal;font-size:15px}
  .job{margin-left:8px;padding-left:16px;border-left:1px solid #334155;font-size:14px;color:#cbd5e1}
  .job b{color:#fff;font-weight:600}
  .top .sp{flex:1}
  .demo{font-size:11px;text-transform:uppercase;letter-spacing:.08em;background:#1e293b;color:#94a3b8;padding:5px 10px;border-radius:99px}

  .wrap{display:grid;grid-template-columns:330px 1fr;gap:18px;padding:18px 22px;max-width:1500px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);font-weight:700;margin-bottom:12px}
  .blk{margin-bottom:22px}
  .blk:last-child{margin-bottom:0}

  /* Filtres */
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 7px 6px 12px;font-size:13.5px;font-weight:500;cursor:pointer;transition:.15s;user-select:none}
  .chip:hover{border-color:#a5b4fc}
  .chip .n{background:#eef2f7;color:var(--mut);font-size:11.5px;font-weight:700;border-radius:99px;min-width:26px;padding:2px 6px;text-align:center}
  .chip.on{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(79,70,229,.3)}
  .chip.on .n{background:rgba(255,255,255,.22);color:#fff}
  .add{display:flex;gap:7px;margin-top:11px}
  .add input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;padding:8px 11px;font-size:13.5px;outline:none}
  .add input:focus{border-color:var(--brand)}
  .add button{border:0;background:var(--ink);color:#fff;border-radius:10px;padding:0 13px;font-weight:700;cursor:pointer}
  .seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:#eef2f7;border-radius:10px;padding:3px;margin-top:11px}
  .seg button{border:0;background:transparent;border-radius:8px;padding:7px 4px;font-size:12.5px;font-weight:600;color:var(--mut);cursor:pointer}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(15,23,42,.15)}
  .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-size:14px}
  .row b{font-size:20px;color:var(--brand);font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--brand);height:24px}
  .reset{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px;font-weight:600;cursor:pointer}
  .reset:hover{border-color:var(--ko);color:var(--ko)}

  /* Compteurs */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
  .stat{border-radius:16px;padding:16px 18px;border:1px solid var(--line);background:#fff}
  .stat .l{font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--mut);display:flex;align-items:center;gap:7px}
  .stat .l::before{content:"";width:9px;height:9px;border-radius:50%;background:#94a3b8}
  .stat .v{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums;margin-top:4px}
  .stat .s{font-size:13px;color:var(--mut)}
  .stat.ok{background:linear-gradient(180deg,#ecfdf5,#fff);border-color:#a7f3d0}
  .stat.ok .l::before{background:var(--ok)} .stat.ok .v{color:#059669}
  .stat.ko{background:linear-gradient(180deg,#fef2f2,#fff);border-color:#fecaca}
  .stat.ko .l::before{background:var(--ko)} .stat.ko .v{color:#dc2626}
  .bar{height:10px;border-radius:99px;background:var(--kobg);overflow:hidden;margin-bottom:14px}
  .bar div{height:100%;background:var(--ok);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1);width:100%}
  .bar.idle{background:#e2e8f0}.bar.idle div{background:#94a3b8}

  .why{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;min-height:32px}
  .pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px 6px 5px 13px;font-size:13px;font-weight:500}
  .pill b{background:var(--kobg);color:#b91c1c;border-radius:99px;padding:2px 9px;font-size:12.5px;font-variant-numeric:tabular-nums}
  .pill.z{opacity:.45}.pill.z b{background:#eef2f7;color:var(--mut)}

  /* Pastilles candidats */
  .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap}
  .head h2{margin:0}
  .leg{display:flex;gap:14px;font-size:12.5px;color:var(--mut)}
  .leg span{display:inline-flex;align-items:center;gap:6px}
  .leg i{width:10px;height:10px;border-radius:50%}
  .dots{display:flex;flex-wrap:wrap;gap:7px}
  .dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;cursor:pointer;border:0;
       background:#e0e7ff;color:#3730a3;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .45s,background .3s,color .3s,box-shadow .3s}
  .dot:hover{outline:2.5px solid var(--ink);outline-offset:2px}
  .dot.ok{background:var(--ok);color:#fff;box-shadow:0 3px 10px rgba(16,185,129,.4)}
  .dot.ko{background:var(--kobg);color:#f87171;transform:scale(.62);opacity:.55}
  .dot.sel{outline:2.5px solid var(--ink);outline-offset:2px}

  /* Fiche candidat */
  .sheet{position:fixed;right:18px;bottom:18px;width:340px;max-width:calc(100vw - 36px);background:#fff;border-radius:18px;border:1px solid var(--line);
         box-shadow:0 24px 60px rgba(15,23,42,.25);padding:18px;transform:translateY(20px);opacity:0;pointer-events:none;transition:.25s;z-index:5}
  .sheet.show{transform:none;opacity:1;pointer-events:auto}
  .sheet .x{position:absolute;top:10px;right:12px;border:0;background:none;font-size:22px;color:var(--mut);cursor:pointer;line-height:1}
  .who{display:flex;gap:12px;align-items:center;margin-bottom:12px}
  .av{width:46px;height:46px;border-radius:50%;background:#e0e7ff;color:#3730a3;display:grid;place-items:center;font-weight:800}
  .who b{display:block;font-size:16px}.who small{color:var(--mut);font-size:13px}
  .meta{font-size:13.5px;color:#334155;line-height:1.7;margin-bottom:10px}
  .tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
  .tag{font-size:12px;padding:3px 9px;border-radius:99px;background:#f1f5f9;color:#475569;font-weight:500}
  .tag.hit{background:var(--okbg);color:#047857;font-weight:700}
  .verdict{border-radius:12px;padding:11px 13px;font-size:13.5px;line-height:1.55}
  .verdict b{display:block;font-size:14.5px;margin-bottom:2px}
  .verdict.ok{background:var(--okbg);color:#065f46}
  .verdict.ko{background:var(--kobg);color:#991b1b}
  .verdict.idle{background:#f1f5f9;color:#475569}

  @media (max-width:900px){
    .wrap{grid-template-columns:1fr;padding:12px}
    .stat .v{font-size:34px}.stat{padding:12px}
    .stats{gap:8px}
    .dot{width:26px;height:26px;font-size:9px}
    .dots{gap:5px}
    .job{border:0;padding:0;margin:0;width:100%}
  }
</style>
</head>
<body>

<div class="top">
  <div class="logo"><i>◆</i>TriCV <span style="font-weight:400;color:#94a3b8">ATS</span></div>
  <div class="job">Offre : <b>Chef de projet marketing digital</b> · CDI · Lyon</div>
  <div class="sp"></div>
  <div class="demo">Simulation</div>
</div>

<div class="wrap">
  <aside class="card">
    <div class="blk">
      <h2>Mots-clés sur le CV</h2>
      <div class="chips" id="chips"></div>
      <form class="add" id="addForm">
        <input id="addIn" placeholder="Ajouter un mot-clé…" maxlength="24" autocomplete="off">
        <button type="submit">+</button>
      </form>
      <div class="seg" id="mode">
        <button data-m="all" class="on">Tous les mots-clés</button>
        <button data-m="any">Au moins un</button>
      </div>
    </div>

    <div class="blk">
      <h2>Expérience</h2>
      <div class="row"><span>Minimum requis</span><b id="expV">0 an</b></div>
      <input type="range" id="exp" min="0" max="10" step="1" value="0">
    </div>

    <div class="blk">
      <h2>Diplôme minimum</h2>
      <div class="seg" id="dip">
        <button data-d="0" class="on">Tous</button>
        <button data-d="2">Bac+2</button>
        <button data-d="3">Bac+3</button>
        <button data-d="5">Bac+5</button>
      </div>
    </div>

    <button class="reset" id="reset">↺ Réinitialiser les filtres</button>
  </aside>

  <main>
    <div class="stats">
      <div class="stat"><div class="l">Candidatures reçues</div><div class="v" id="nAll">0</div><div class="s">pour cette offre</div></div>
      <div class="stat ok"><div class="l">Retenus</div><div class="v" id="nOk">0</div><div class="s" id="pOk">100 % des CV</div></div>
      <div class="stat ko"><div class="l">Rejetés</div><div class="v" id="nKo">0</div><div class="s" id="pKo">jamais lus par un humain</div></div>
    </div>
    <div class="bar idle" id="bar"><div></div></div>

    <div class="why" id="why"></div>

    <div class="card">
      <div class="head">
        <h2>Tous les candidats</h2>
        <div class="leg">
          <span><i style="background:var(--ok)"></i>Retenu</span>
          <span><i style="background:#fca5a5"></i>Rejeté</span>
        </div>
      </div>
      <div class="dots" id="dots"></div>
    </div>
  </main>
</div>

<div class="sheet" id="sheet">
  <button class="x" id="close">×</button>
  <div id="sheetBody"></div>
</div>

<script>
/* ---------- Données fictives (générées, toujours identiques) ---------- */
const N = 247;
let seed = 20261112;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const pick = a => a[Math.floor(rnd() * a.length)];

const PRENOMS = ["Léa","Hugo","Chloé","Lucas","Manon","Nathan","Camille","Enzo","Sarah","Louis","Inès","Jules","Emma","Adam","Jade","Théo","Lina","Tom","Zoé","Noah","Clara","Maxime","Anaïs","Yanis","Julie","Antoine","Sofia","Paul","Margaux","Rayan","Élise","Baptiste","Aïcha","Quentin","Océane","Mehdi","Pauline","Romain","Nina","Karim","Laura","Victor","Fatou","Alexis","Mathilde","Samuel","Amandine","Kevin","Salomé","Bastien"];
const NOMS = ["Martin","Bernard","Dubois","Thomas","Robert","Richard","Petit","Durand","Leroy","Moreau","Simon","Laurent","Lefebvre","Michel","Garcia","David","Bertrand","Roux","Vincent","Fournier","Morel","Girard","André","Mercier","Dupont","Lambert","Bonnet","François","Martinez","Legrand","Garnier","Faure","Rousseau","Blanc","Guérin","Muller","Henry","Roussel","Nicolas","Perrin","Morin","Mathieu","Clément","Gauthier","Dumont","Lopez","Fontaine","Chevalier","Robin","Benali","Diallo","Nguyen","Traoré","Haddad"];
const POSTES = ["Chargé·e de marketing","Chef de projet digital","Community manager","Assistant·e marketing","Responsable communication","Traffic manager","Chef de produit","Chargé·e de CRM","Consultant·e SEO","Content manager","Business developer","Chargé·e d'acquisition"];
const VILLES = ["Lyon","Paris","Villeurbanne","Grenoble","Marseille","Saint-Étienne","Lille","Nantes","Bordeaux","Toulouse"];
/* mot-clé : probabilité d'apparaître sur un CV */
const SKILLS = {"Gestion de projet":.55,"SEO":.42,"Google Analytics":.38,"Réseaux sociaux":.6,"Excel":.5,"CRM":.33,"Anglais":.48,"HubSpot":.18,"Google Ads":.3,"Emailing":.36,"Canva":.4,"Management":.22,"Budget":.25,"Agile":.2,"Power BI":.12};
const DIPS = [[0,"Bac"],[2,"Bac+2"],[3,"Bac+3"],[5,"Bac+5"]];

const C = Array.from({length:N}, (_, i) => {
  const prenom = pick(PRENOMS), nom = pick(NOMS);
  const r = rnd();
  const dip = r < .06 ? DIPS[0] : r < .26 ? DIPS[1] : r < .58 ? DIPS[2] : DIPS[3];
  const exp = Math.min(18, Math.floor(Math.pow(rnd(), 1.7) * 16));
  const skills = Object.keys(SKILLS).filter(k => rnd() < SKILLS[k] + Math.min(exp, 8) * .012);
  if (!skills.length) skills.push("Réseaux sociaux");
  return {i, prenom, nom, ini: prenom[0] + nom[0], poste: pick(POSTES), ville: pick(VILLES), dip: dip[0], dipL: dip[1], exp, skills: new Set(skills)};
});

/* Mot-clé ajouté à la main : présent sur ~25 % des CV, de façon stable */
const hash = s => { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const norm = s => s.trim().toLowerCase();
function addSkill(label){
  C.forEach(c => { if (hash(norm(label) + "|" + c.i) % 100 < 25) c.skills.add(label); });
}

/* ---------- État ---------- */
const F = {kws: new Set(), mode: "all", exp: 0, dip: 0};
const labels = Object.keys(SKILLS);
const $ = id => document.getElementById(id);
const ans = n => n + (n > 1 ? " ans" : " an");

function evaluate(c){
  const out = [];
  if (F.kws.size){
    const miss = [...F.kws].filter(k => !c.skills.has(k));
    if (F.mode === "all" ? miss.length > 0 : miss.length === F.kws.size)
      out.push({t:"kw", txt: (F.mode === "all" ? "Mot-clé absent du CV : " : "Aucun mot-clé trouvé : ") + miss.join(", ")});
  }
  if (c.exp < F.exp) out.push({t:"exp", txt:`Expérience insuffisante : ${ans(c.exp)} (minimum ${ans(F.exp)})`});
  if (c.dip < F.dip) out.push({t:"dip", txt:`Diplôme insuffisant : ${c.dipL} (minimum Bac+${F.dip})`});
  return out;
}
const active = () => F.kws.size > 0 || F.exp > 0 || F.dip > 0;

/* ---------- Rendu ---------- */
const dotsEl = $("dots");
C.forEach(c => {
  const b = document.createElement("button");
  b.className = "dot"; b.textContent = c.ini; b.title = c.prenom + " " + c.nom;
  b.onclick = () => openSheet(c);
  c.el = b; dotsEl.appendChild(b);
});

function renderChips(){
  $("chips").innerHTML = "";
  labels.forEach(k => {
    const n = C.filter(c => c.skills.has(k)).length;
    const el = document.createElement("div");
    el.className = "chip" + (F.kws.has(k) ? " on" : "");
    el.innerHTML = `<span></span><span class="n">${n}</span>`;
    el.firstChild.textContent = k;
    el.onclick = () => { F.kws.has(k) ? F.kws.delete(k) : F.kws.add(k); renderChips(); update(); };
    $("chips").appendChild(el);
  });
}

const shown = {};
function count(id, to){
  const from = shown[id] ?? 0; shown[id] = to;
  const el = $(id), t0 = performance.now(), d = 500;
  (function step(t){
    const p = Math.min(1, (t - t0) / d), e = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(from + (to - from) * e);
    if (p < 1 && shown[id] === to) requestAnimationFrame(step);
  })(t0);
}

let current = null;
function update(){
  const on = active();
  let ok = 0; const why = {kw:0, exp:0, dip:0};
  C.forEach((c, idx) => {
    c.reasons = evaluate(c);
    const pass = c.reasons.length === 0;
    if (pass) ok++; else why[c.reasons[0].t]++;
    c.el.style.transitionDelay = (idx * 1.6) + "ms";
    c.el.classList.toggle("ok", on && pass);
    c.el.classList.toggle("ko", !pass);
  });
  const ko = N - ok;
  count("nAll", N); count("nOk", ok); count("nKo", ko);
  $("pOk").textContent = Math.round(ok / N * 100) + " % des CV";
  $("pKo").textContent = ko ? Math.round(ko / N * 100) + " % · jamais lus par un humain" : "jamais lus par un humain";
  $("bar").classList.toggle("idle", !on);
  $("bar").firstElementChild.style.width = (ok / N * 100) + "%";
  $("why").innerHTML = [["kw","Mots-clés manquants"],["exp","Expérience insuffisante"],["dip","Diplôme insuffisant"]]
    .map(([k, l]) => `<span class="pill${why[k] ? "" : " z"}">${l}<b>${why[k]}</b></span>`).join("");
  if (current) openSheet(current);
}

function openSheet(c){
  current = c;
  C.forEach(x => x.el.classList.toggle("sel", x === c));
  const esc = s => s.replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
  const tags = [...c.skills].map(s => `<span class="tag${F.kws.has(s) ? " hit" : ""}">${esc(s)}</span>`).join("");
  let v;
  if (!active()) v = `<div class="verdict idle"><b>En attente de tri</b>Aucun filtre appliqué pour l'instant.</div>`;
  else if (!c.reasons.length) v = `<div class="verdict ok"><b>✓ Retenu</b>Le CV passe tous les filtres.</div>`;
  else v = `<div class="verdict ko"><b>✕ Rejeté automatiquement</b>${c.reasons.map(r => esc(r.txt)).join("<br>")}</div>`;
  $("sheetBody").innerHTML = `
    <div class="who"><div class="av">${c.ini}</div><div><b>${c.prenom} ${c.nom}</b><small>${c.poste}</small></div></div>
    <div class="meta">📍 ${c.ville}<br>💼 ${ans(c.exp)} d'expérience<br>🎓 ${c.dipL}</div>
    <div class="tags">${tags}</div>${v}`;
  $("sheet").classList.add("show");
}
$("close").onclick = () => { $("sheet").classList.remove("show"); current && current.el.classList.remove("sel"); current = null; };

/* ---------- Interactions ---------- */
$("addForm").onsubmit = e => {
  e.preventDefault();
  const raw = $("addIn").value.trim(); if (!raw) return;
  let k = labels.find(l => norm(l) === norm(raw));
  if (!k){ k = raw[0].toUpperCase() + raw.slice(1); labels.push(k); addSkill(k); }
  F.kws.add(k); $("addIn").value = ""; renderChips(); update();
};
function seg(id, attr, key, cast){
  $(id).onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    [...$(id).children].forEach(x => x.classList.toggle("on", x === b));
    F[key] = cast(b.dataset[attr]); update();
  };
}
seg("mode", "m", "mode", String);
seg("dip", "d", "dip", Number);
$("exp").oninput = e => { F.exp = +e.target.value; $("expV").textContent = ans(F.exp); update(); };
$("reset").onclick = () => {
  F.kws.clear(); F.mode = "all"; F.exp = 0; F.dip = 0;
  $("exp").value = 0; $("expV").textContent = "0 an";
  [["mode","m","all"],["dip","d","0"]].forEach(([id, a, v]) => [...$(id).children].forEach(x => x.classList.toggle("on", x.dataset[a] === v)));
  renderChips(); update();
};

renderChips(); update();
</script>
</body>
</html>
